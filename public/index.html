<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيقاتي العراق 🇮🇶</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    h1 { text-align: center; color: #1976d2; margin-bottom: 30px; }
    .upload-area {
      border: 3px dashed #1976d2;
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 20px;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 2px solid #ddd;
      border-radius: 8px;
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }
    .status {
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
      text-align: center;
    }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    .hidden { display: none; }
    iframe {
      width: 100%;
      height: 400px;
      border: 2px solid #ddd;
      border-radius: 8px;
      margin: 15px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🇮🇶 تطبيقاتي العراق</h1>
    
    <div class="upload-area" id="uploadArea">
      <p>📁 اضغط لرفع ملف HTML أو ZIP</p>
      <input type="file" id="fileInput" accept=".html,.zip" hidden>
    </div>
    
    <div id="step1" class="hidden">
      <h3>تخصيص التطبيق</h3>
      <input type="text" id="appName" placeholder="اسم التطبيق">
      <button id="previewBtn">معاينة</button>
    </div>
    
    <div id="step2" class="hidden">
      <h3>معاينة</h3>
      <iframe id="previewFrame"></iframe>
      <button id="buildBtn"> تحويل إلى APK</button>
    </div>
    
    <div id="step3" class="hidden">
      <div class="status success" id="result"></div>
      <button id="downloadBtn">⬇️ تنزيل APK</button>
    </div>
    
    <div id="status" class="status hidden"></div>
  </div>

  <script>
    let projectId = null;
    let buildData = null;

    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const status = document.getElementById('status');

    uploadArea.onclick = () => fileInput.click();

    fileInput.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      status.className = 'status';
      status.textContent = '⏳ جاري الرفع...';
      status.classList.remove('hidden');

      const formData = new FormData();
      formData.append('project', file);

      try {
        const res = await fetch('/api/upload', { method: 'POST', body: formData });
        const data = await res.json();

        if (data.success) {
          projectId = data.projectId;
          status.textContent = '✅ تم الرفع بنجاح!';
          status.classList.add('success');
          document.getElementById('step1').classList.remove('hidden');
        } else {
          throw new Error(data.error);
        }
      } catch (err) {
        status.textContent = ' ' + err.message;
        status.classList.add('error');
      }
    };

    document.getElementById('previewBtn').onclick = () => {
      document.getElementById('previewFrame').src = `/api/preview/${projectId}`;
      document.getElementById('step2').classList.remove('hidden');
    };

    document.getElementById('buildBtn').onclick = async () => {
      const btn = document.getElementById('buildBtn');
      btn.disabled = true;
      btn.textContent = '⏳ جاري البناء...';

      try {
        const res = await fetch('/api/build', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ projectId, appName: document.getElementById('appName').value || 'تطبيقي' })
        });
        const data = await res.json();

        if (data.success) {
          buildData = data;
          document.getElementById('result').textContent = '✅ تم بناء التطبيق بنجاح!';
          document.getElementById('step3').classList.remove('hidden');
        } else {
          throw new Error(data.error);
        }
      } catch (err) {
        alert('خطأ: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = ' تحويل إلى APK';
      }
    };

    document.getElementById('downloadBtn').onclick = () => {
      if (buildData) window.location.href = buildData.apkUrl;
    };
  </script>
</body>
</html>
